<!doctype html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>BAGHDAD GPL — Gestion de l'atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div id="app" class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
            <div class="brand">
                <div class="brand-mark"><img src="img/logo.png" alt="Logo BAGHDAD GPL"></div>
                <div class="brand-copy">
                    <strong>BAGHDAD GPL</strong>
                    <span>FAMILY METAL</span>
                </div>
            </div>

            <div class="sidebar-label">Espace de travail</div>
            <nav class="main-nav">
                <a href="#home" class="nav-link" data-view="home"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Accueil</span></a>
                <a href="#clients" class="nav-link" data-view="clients"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Clients &amp; Opérations</span></a>
                <a href="#operations" class="nav-link" data-view="operations"><i class="fa-solid fa-list-check" aria-hidden="true"></i><span>Opérations</span></a>
            </nav>

            <div class="sidebar-label sidebar-label-settings">Configuration</div>
            <nav class="main-nav">
                <a href="#settings" class="nav-link" data-view="settings"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>Paramètres</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="secure-note"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span>Données conservées localement</span></div>
                <small>© 2026 Family Metal</small>
            </div>
        </aside>

        <div class="content-shell">
            <header class="topbar">
                <button class="mobile-menu-button icon-button" id="mobileMenuButton" type="button" aria-label="Ouvrir le menu" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
                <div class="breadcrumb" id="breadcrumb" aria-live="polite"></div>
                <div class="topbar-actions">
                    <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notifications" aria-expanded="false">
                        <i class="fa-regular fa-bell" aria-hidden="true"></i>
                        <span class="notification-badge is-hidden" id="notificationBadge" aria-label="Notifications non lues">0</span>
                    </button>
                    <div class="notification-panel is-hidden" id="notificationPanel" role="status" aria-live="polite"></div>
                    <div class="topbar-separator" aria-hidden="true"></div>
                    <div class="user-chip"><span class="user-avatar">FM</span><span class="user-name">Atelier</span></div>
                </div>
            </header>

            <main class="main-content" id="mainContent" tabindex="-1"></main>
        </div>
    </div>

    <div id="modalRoot"></div>
    <input type="file" id="logoFileInput" accept="image/png,image/jpeg,image/webp" hidden>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
